# 云编译公用核心 - R30B1 设备专用
name: R30B1-WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{secrets.GH_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Install host build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl git pkg-config libncurses5-dev libncursesw5-dev libtinfo-dev libsqlite3-dev libssl-dev zlib1g-dev libbz2-dev libreadline-dev libffi-dev liblzma-dev

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix python3-netifaces libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          #echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_DATE=$(TZ=UTC-8 date +"%Y%m%d")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          # 确保在 wrt 目录内执行 dos2unix
          if [ -d "./wrt" ]; then
            find ./wrt -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;
          else
            echo "::warning::wrt directory not found, skipping dos2unix."
          fi

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@v4
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          # 替换 luci feed：删除所有 luci 相关行，然后添加新版本
          if grep -q "coolsnowwolf/luci" "feeds.conf.default"; then
            # 删除所有包含 coolsnowwolf/luci 的行（不管是否被注释）
            sed -i '/coolsnowwolf\/luci/d' "feeds.conf.default"
            echo "src-git luci https://github.com/coolsnowwolf/luci.git;openwrt-24.10" >> "feeds.conf.default"
            echo "luci feed updated to openwrt-24.10"
          else
            echo "::warning::coolsnowwolf/luci feed not found in feeds.conf.default, skipping replacement"
          fi

          # 复制自定义文件到固件中（添加存在性检查）
          copy_custom_file() {
            local src="$1"
            local dst="$2"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              chmod +x "$dst"
              echo "Copied: $src -> $dst"
            else
              echo "::warning::Custom file not found: $src"
            fi
          }

          copy_custom_file "$GITHUB_WORKSPACE/Scripts/npc/rc2.local" "package/base-files/files/etc/rc.local"
          copy_custom_file "$GITHUB_WORKSPACE/Scripts/npc/npc.conf" "package/base-files/files/etc/npc.conf"
          copy_custom_file "$GITHUB_WORKSPACE/r30b1/filogic.mk" "target/linux/mediatek/image/filogic.mk"
          copy_custom_file "$GITHUB_WORKSPACE/r30b1/mt7981b-clt-r30b1-112m.dts" "target/linux/mediatek/dts/mt7981b-clt-r30b1-112m.dts"
          copy_custom_file "$GITHUB_WORKSPACE/r30b1/mt7981b-clt-r30b1.dts" "target/linux/mediatek/dts/mt7981b-clt-r30b1.dts"
          copy_custom_file "$GITHUB_WORKSPACE/r30b1/02_network" "target/linux/mediatek/filogic/base-files/etc/board.d/02_network"
          copy_custom_file "$GITHUB_WORKSPACE/r30b1/mac80211.sh" "package/kernel/mac80211/files/lib/wifi/mac80211.sh"

          echo "r30b1 和 3000M dts 文件替换完成"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          # 添加脚本存在性检查和执行权限
          if [ -f "$GITHUB_WORKSPACE/Scripts/Packages.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/Scripts/Packages.sh"
            $GITHUB_WORKSPACE/Scripts/Packages.sh
          else
            echo "::warning::Packages.sh not found, skipping"
          fi

          if [ -f "$GITHUB_WORKSPACE/Scripts/Handles.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/Scripts/Handles.sh"
            $GITHUB_WORKSPACE/Scripts/Handles.sh
          else
            echo "::warning::Handles.sh not found, skipping"
          fi

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            # 如果源码仓库有 defconfig 目录则合并匹配文件
            if [ -d "./defconfig" ]; then
              find ./defconfig -type f -iname "*$WRT_CONFIG*" -exec cat {} + | sort | uniq > .config
            else
              echo "No defconfig directory found, starting with empty .config"
              touch .config
            fi

            if [ -f "$GITHUB_WORKSPACE/Scripts/Settings-lede.sh" ]; then
              chmod +x "$GITHUB_WORKSPACE/Scripts/Settings-lede.sh"
              $GITHUB_WORKSPACE/Scripts/Settings-lede.sh
            else
              echo "::warning::Settings-lede.sh not found, skipping"
            fi
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi
          # defconfig 和 clean 目标不支持多线程，去掉 -j 参数
          make defconfig && make clean

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j$(nproc) V=s

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              BASENAME=$(basename "$FILE")
              # 改进扩展名提取：提取最后一个点号后的内容作为扩展名
              if [[ "$BASENAME" =~ \. ]]; then
                EXT="${BASENAME##*.}"
                NAME="${BASENAME%.*}"
              else
                EXT=""
                NAME="$BASENAME"
              fi
              # 从文件名中提取包含 WRT_TARGET 的部分
              NAME=$(echo "$NAME" | grep -io "\($WRT_TARGET\).*")
              if [ -n "$NAME" ]; then
                if [ -n "$EXT" ]; then
                  NEW_FILE="$WRT_INFO"-"$WRT_BRANCH"-"$NAME"-"$WRT_DATE"."$EXT"
                else
                  NEW_FILE="$WRT_INFO"-"$WRT_BRANCH"-"$NAME"-"$WRT_DATE"
                fi
                mv -f "$FILE" ./upload/"$NEW_FILE"
              fi
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带闭源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
